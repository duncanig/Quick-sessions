function leaveRoom(callback){if(document.fullscreenElement)document.exitFullscreen().catch(function(){}).finally(callback);else callback()}
function editMode(){if(mode==='edit')return;if(run&&!sceneBy(run.sceneId).terminal&&(run.path.length||pending||run.seconds>5)){ask('Return to the editor?','This clears the current session. Your scenario edits remain saved.',function(){leaveRoom(function(){mode='edit';run=null;pending=null;render()})})}else leaveRoom(function(){mode='edit';run=null;pending=null;render()})}
function newLibraryScenario(s){if(library.length>=100){tell('Your library has 100 scenarios. Back up and remove an old scenario first.');return}library.push(s);activeId=s.id;selectedId=s.startSceneId;run=null;pending=null;mode='edit';save();render()}
function addScene(terminal){if(current().scenes.length>=200){tell('This scenario already has 200 scenes. Duplicate it to create a new part.');return}var n=blankScene(current().scenes.length+1,terminal);current().scenes.push(n);if(!current().startSceneId)current().startSceneId=n.id;selectedId=n.id;save();refreshEditor();$('#scene-editor').scrollIntoView({block:'start',behavior:'smooth'})}
async function imageUpload(file){var scenarioId=activeId,sceneId=selectedId;if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){tell('Choose a PNG, JPEG or WebP image.');return}if(file.size>5*1024*1024){tell('Choose an image smaller than 5 MB.');return}try{var image=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);image.close();var s=library.find(function(s){return s.id===scenarioId}),n=s&&s.scenes.find(function(n){return n.id===sceneId});if(!n)return;n.image=canvas.toDataURL('image/webp',.76);save();if(mode==='edit'&&activeId===scenarioId&&selectedId===sceneId)refreshEditor()}catch(e){tell('This image could not be read. Try a different PNG, JPEG or WebP image.')}}
function sessionActive(){return mode==='play'&&run&&!sceneBy(run.sceneId).terminal&&(run.path.length||pending||run.seconds>5)}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled||dialogAction)return;var act=b.dataset.act,s=current(),n=sceneBy(selectedId);
 if(act==='dismiss'){notice='';$('#notice').hidden=true}
 else if(act==='play'){if(mode==='play')return;if(start()){mode='play';notice='';render()}}
 else if(act==='edit')editMode();
 else if(act==='view'){real=false;view=b.dataset.v;$('.viewbar').outerHTML=viewbarHTML();fit()}
 else if(act==='real'){real=!real;if(real)view='room';$('.viewbar').outerHTML=viewbarHTML();fit()}
 else if(act==='guides'){guides=!guides;$('.viewbar').outerHTML=viewbarHTML();fit()}
 else if(act==='fullscreen'){real=false;view='room';$('.viewbar').outerHTML=viewbarHTML();$('#room-shell').requestFullscreen().catch(function(){tell('Fullscreen could not open. Use Chromium’s F11 key instead.')});fit()}
 else if(act==='choose')choose(Number(b.dataset.i));else if(act==='next')next();else if(act==='back')back();
 else if(act==='pause'){paused=!paused;lastTick=performance.now();updatePlay()}
 else if(act==='notes'){notes=!notes;updatePlay()}
 else if(act==='restart')ask('Restart this session?','This clears the current score, decisions and timer.',function(){start();updatePlay()});
 else if(['new','import','duplicate','delete'].includes(act)&&sessionActive()){ask('Leave the current session?','Your scenario is saved. This session’s decisions and score will be cleared.',function(){mode='edit';run=null;pending=null;render();var button=document.querySelector('[data-act="'+act+'"]');if(button)button.click()})}
 else if(act==='new')newLibraryScenario(blankScenario());else if(act==='import')$('#import-file').click();else if(act==='download-html')htmlDownload();
 else if(act==='export')download(slug(s.title)+'.json',JSON.stringify(s,null,2));else if(act==='backup')download('igloo-scenario-library.json',JSON.stringify(library,null,2));
 else if(act==='duplicate'){var copy=clone(s);copy.id=uid();copy.title+=' (copy)';newLibraryScenario(copy)}
 else if(act==='delete')ask('Delete this scenario?','Download a backup first if you want to keep it. This removes it from this browser.',function(){library=library.filter(function(x){return x.id!==s.id});if(!library.length)library=[blankScenario()];activeId=library[0].id;selectedId=current().startSceneId;save();render()});
 else if(act==='select-scene'||act==='issue'){if(b.dataset.id){selectedId=b.dataset.id;refreshEditor();$('#scene-editor').scrollIntoView({block:'start',behavior:'smooth'})}else $('#scenario-settings').scrollIntoView({block:'start',behavior:'smooth'})}
 else if(act==='add-scene')addScene(false);else if(act==='add-outcome')addScene(true);
 else if(act==='set-start'){s.startSceneId=n.id;save();refreshEditor()}
 else if(act==='add-choice'&&n.choices.length<4){n.choices.push(choice());save();refreshEditor()}
 else if(act==='remove-choice'){n.choices=n.choices.filter(function(c){return c.id!==b.dataset.id});save();refreshEditor()}
 else if(act==='duplicate-scene'){if(s.scenes.length>=200){tell('The scene limit is 200.');return}var cp=clone(n);cp.id=uid();cp.title+=' (copy)';cp.choices.forEach(function(c){c.id=uid()});s.scenes.push(cp);selectedId=cp.id;save();refreshEditor()}
 else if(act==='delete-scene')ask('Delete this scene?','Choices pointing to it will need a new destination. This cannot be undone.',function(){s.scenes=s.scenes.filter(function(x){return x.id!==n.id});if(s.startSceneId===n.id)s.startSceneId=s.scenes[0]?s.scenes[0].id:'';selectedId=s.startSceneId;save();refreshEditor()});
 else if(act==='remove-image'){delete n.image;save();refreshEditor()}
 else if(act==='results-json')download('session-results.json',JSON.stringify(resultData(),null,2));else if(act==='results-csv')exportCSV();else if(act==='print')leaveRoom(function(){window.print()});
});
function updateField(t){var s=current(),n=sceneBy(selectedId),key=t.dataset.f,scope=t.dataset.scope,value=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;if(!key)return;if(t.type==='number'){var min=Number(t.min),max=Number(t.max);value=Math.min(max,Math.max(min,Number.isFinite(value)?value:min));if(key==='timerSeconds')value=Math.floor(value)}if(scope==='scenario')s[key]=value;else if(scope==='presentation')s.presentation[key]=value;else if(scope==='choice'){var c=n.choices.find(function(c){return c.id===t.dataset.choice});if(c)c[key]=value}else if(scope==='outcome'){n.outcome=n.outcome||{label:n.title,review:'',tone:'neutral'};n.outcome[key]=value}else if(n){n[key]=value;if(key==='terminal'&&value)n.outcome=n.outcome||{label:n.title,review:'What can the group learn from this outcome?',tone:'neutral'}}save();refreshMetadata();if(key==='terminal')refreshEditor()}
document.addEventListener('input',function(e){if(e.target.matches('[data-f]')&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')updateField(e.target)});
document.addEventListener('change',async function(e){var t=e.target;if(t.matches('[data-f]')&&(t.type==='checkbox'||t.tagName==='SELECT'))updateField(t);if(t.id==='scenario-select'){var id=t.value;function switchScenario(){activeId=id;selectedId=current().startSceneId;run=null;pending=null;save();if(mode==='play'&&!start())return;render()}if(sessionActive()){t.value=activeId;ask('Switch scenarios?','The current session’s score and decisions will be cleared.',switchScenario)}else switchScenario()}else if(t.id==='image-upload')imageUpload(t.files[0]);else if(t.id==='import-file'){var file=t.files[0];if(!file)return;try{if(file.size>30000000)throw Error('Choose a backup smaller than 30 MB.');var arr=importData(await file.text());if(library.length+arr.length>100)throw Error('A library holds up to 100 scenarios. Back up and remove unused scenarios first.');arr.forEach(function(s){if(library.some(function(x){return x.id===s.id})){s.id=uid();s.title+=' (imported)'}library.push(s)});activeId=arr[0].id;selectedId=current().startSceneId;mode='edit';run=null;pending=null;save();notice='Imported '+arr.length+' scenario'+(arr.length===1?'':'s')+'.';render()}catch(err){tell(err.message)}t.value=''}});
document.addEventListener('keydown',function(e){if(dialogAction)return;var target=e.target;if(target.closest('.map-node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();target.closest('.map-node').dispatchEvent(new MouseEvent('click',{bubbles:true}));return}if(mode!=='play'||!run||target.matches('input,textarea,select'))return;var k=e.key.toLowerCase();if(['1','2','3','4',' ','arrowleft','f','n','r'].includes(k))e.preventDefault();if(/^[1-4]$/.test(k))choose(Number(k)-1);else if(k===' '){if(sceneBy(run.sceneId).terminal)return;if(paused){paused=false;updatePlay()}else if(pending)next();else{paused=true;updatePlay()}lastTick=performance.now()}else if(k==='arrowleft')back();else if(k==='n'){notes=!notes;updatePlay()}else if(k==='r')ask('Restart this session?','This clears the current score, decisions and timer.',function(){start();updatePlay()});else if(k==='f'){var b=$('[data-act="fullscreen"]');if(b)b.click()}});
window.addEventListener('resize',function(){fit();var d=$('#confirm-dialog');if(d)positionDialog(d)});document.addEventListener('fullscreenchange',function(){fit();var d=$('#confirm-dialog');if(d)positionDialog(d)});
window.addEventListener('beforeunload',function(e){if(saveError||sessionActive())e.preventDefault()});
if(start()){render();containWalls()}
})();
</script></body></html>
